<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1f3a34">
<meta name="description" content="经济学思维与现实世界——零基础系统自学平台。像经济学家一样思考，用经济学原理独立分析真实世界。">
<title>经济学思维与现实世界 · 自学平台</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body>

<!-- 顶部进度条 -->
<div id="progressBar" class="progress-bar" aria-hidden="true"><span></span></div>

<!-- 顶部导航 -->
<header class="topbar">
  <button id="menuBtn" class="icon-btn" aria-label="打开目录">
    <svg viewBox="0 0 24 24" width="22" height="22"><path d="M3 6h18M3 12h18M3 18h18" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/></svg>
  </button>
  <div class="topbar-title" id="topbarTitle">经济学思维与现实世界</div>
  <div class="topbar-actions">
    <button id="fontBtn" class="icon-btn" aria-label="字号设置" title="字号设置">
      <svg viewBox="0 0 24 24" width="20" height="20"><path d="M4 7h11M9.5 7v10M15 11h5M17.5 11v6" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round"/></svg>
    </button>
    <button id="searchBtn" class="icon-btn" aria-label="搜索" title="搜索">
      <svg viewBox="0 0 24 24" width="20" height="20"><circle cx="11" cy="11" r="6.5" stroke="currentColor" stroke-width="1.8" fill="none"/><path d="M16 16l4.5 4.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
    </button>
  </div>
</header>

<!-- 侧边抽屉 -->
<div id="drawerOverlay" class="drawer-overlay"></div>
<aside id="drawer" class="drawer" aria-label="课程目录">
  <div class="drawer-head">
    <div class="drawer-brand">
      <div class="brand-mark">经</div>
      <div>
        <div class="brand-title">经济学思维</div>
        <div class="brand-sub">与现实世界 · 系统自学</div>
      </div>
    </div>
    <button id="drawerClose" class="icon-btn" aria-label="关闭目录">
      <svg viewBox="0 0 24 24" width="20" height="20"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/></svg>
    </button>
  </div>
  <div class="drawer-progress">
    <div class="dp-top"><span>学习进度</span><span id="progressPct">0%</span></div>
    <div class="dp-track"><div id="progressFill"></div></div>
    <div class="dp-count" id="progressCount">已读 0 / 33 章</div>
  </div>
  <nav id="drawerNav" class="drawer-nav"></nav>
</aside>

<!-- 搜索面板 -->
<div id="searchOverlay" class="search-overlay">
  <div class="search-panel">
    <div class="search-head">
      <svg viewBox="0 0 24 24" width="20" height="20"><circle cx="11" cy="11" r="6.5" stroke="currentColor" stroke-width="1.8" fill="none"/><path d="M16 16l4.5 4.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      <input id="searchInput" type="search" placeholder="搜索章节、概念、关键词…" autocomplete="off">
      <button id="searchClose" class="icon-btn" aria-label="关闭搜索">
        <svg viewBox="0 0 24 24" width="20" height="20"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/></svg>
      </button>
    </div>
    <div id="searchResults" class="search-results"></div>
  </div>
</div>

<!-- 字号设置面板 -->
<div id="fontOverlay" class="modal-overlay">
  <div class="modal-card">
    <h3>阅读字号</h3>
    <div class="font-size-row">
      <button class="font-step" data-step="-1">A−</button>
      <span id="fontPreview" class="font-preview">当前字号 <b>17</b>px</span>
      <button class="font-step" data-step="1">A+</button>
    </div>
    <button class="modal-done" id="fontDone">完成</button>
  </div>
</div>

<!-- 主内容区 -->
<main id="app" class="app" tabindex="-1"></main>

<!-- 底部章节导航 -->
<nav id="bottomNav" class="bottom-nav" aria-label="章节翻页">
  <button id="prevChapter" class="bn-btn">
    <svg viewBox="0 0 24 24" width="18" height="18"><path d="M15 5l-7 7 7 7" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <span>上一章</span>
  </button>
  <button id="catalogBtn" class="bn-btn bn-center">
    <svg viewBox="0 0 24 24" width="18" height="18"><path d="M4 6h16M4 12h16M4 18h16" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/></svg>
    <span>目录</span>
  </button>
  <button id="nextChapter" class="bn-btn">
    <span>下一章</span>
    <svg viewBox="0 0 24 24" width="18" height="18"><path d="M9 5l7 7-7 7" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </button>
</nav>

<!-- 回到顶部 -->
<button id="backTop" class="back-top" aria-label="回到顶部">
  <svg viewBox="0 0 24 24" width="20" height="20"><path d="M12 19V5M6 11l6-6 6 6" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
</button>

<!-- 数据脚本（按依赖顺序加载） -->
<script src="data/meta.js"></script>
<script src="data/m01.js"></script>
<script src="data/m02.js"></script>
<script src="data/m03.js"></script>
<script src="data/m04.js"></script>
<script src="data/m05.js"></script>
<script src="data/m06.js"></script>
<script src="data/m07.js"></script>
<script src="data/m08.js"></script>
<script src="data/m09.js"></script>
<script src="data/m10.js"></script>
<script src="assets/charts.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
